name: Meta protected read-only preflight
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: 'Exact main SHA independently reviewed for this read-only run'
        required: true
        type: string
permissions:
  contents: read
  actions: read
  deployments: read
concurrency:
  group: meta-readonly-preflight
  cancel-in-progress: false
jobs:
  guard:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'Meta-Project2026/Metamorph' && github.ref == 'refs/heads/main' && inputs.reviewed_sha == github.sha && (github.actor == 'barbalatv' || github.actor == 'l1ncolny') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require protected main and main-only environment without reviewers
        env:
          GH_TOKEN: ${{ github.token }}
        run: node research/mmp-078/guard.mjs
  preflight:
    needs: guard
    if: ${{ github.ref == 'refs/heads/main' && inputs.reviewed_sha == github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: META_API_KEY
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # No package install, lifecycle scripts, build, tests, Docker or candidate.
      - name: One bounded authenticated GET (no POST)
        env:
          MODEL_API_KEY: ${{ secrets.META }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: node research/mmp-061/meta-preflight.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meta-readonly-public
          path: ${{ runner.temp }}/meta-preflight-public/meta-preflight.json
          if-no-files-found: error
          retention-days: 7
