name: Meta paid migration
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: 'Exact reviewed main SHA; public workshop source only'
        required: true
        type: string
      confirm_paid:
        description: 'One possibly billable attempt; estimate is NOT a hard dollar cap. Timeout may be billed; no retry.'
        required: true
        type: choice
        default: NOT_CONFIRMED
        options: [NOT_CONFIRMED, I_ACCEPT_ONE_PAID_ATTEMPT_NO_HARD_CAP]
      max_estimated_usd:
        description: 'Maximum pre-send USD projection at locked Standard tariff; NOT settled cost or provider cap; actual billing may differ. Untouched default 0.10 intentionally blocks larger projections; higher choices require explicit selection.'
        required: true
        type: choice
        default: '0.10'
        options: ['0.10', '0.20', '0.25', '0.50', '0.75', '1.00']
      model_provider:
        description: 'Fixed Meta Muse Spark 1.3 Standard; one POST, zero repairs/retries'
        type: choice
        default: meta
        options: [meta]
      validate_only:
        description: 'Validate signed admission only: no Meta credential mapping, no Meta GET/POST, no candidate'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  deployments: read
concurrency:
  group: meta-paid-${{ github.actor }}
  cancel-in-progress: false
jobs:
  guard:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact checkout and current GitHub policy without Meta credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: node research/mmp-078/guard.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meta-paid-policy-${{ github.run_id }}
          path: ${{ runner.temp }}/meta-paid-public/policy.json
          retention-days: 7
  generate-and-verify:
    needs: guard
    if: ${{ github.ref == 'refs/heads/main' && inputs.reviewed_sha == github.sha && (github.actor == 'barbalatv' || github.actor == 'l1ncolny') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: META_API_KEY
    permissions:
      contents: read
      actions: read
      deployments: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - name: Install and build trusted code before mapping any Meta credential
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Prepare pinned private diagnostic tools before mapping any Meta credential
        if: ${{ !inputs.validate_only }}
        run: node research/mmp-089/install-age.mjs
      - name: One signed-identity-authorized bounded Meta POST; no code execution
        id: generation
        if: ${{ !inputs.validate_only }}
        env:
          MODEL_API_KEY: ${{ secrets.META }}
          GH_TOKEN: ${{ github.token }}
        run: node research/mmp-078/paid-run.mjs
      - name: Validate real signed authorization without Meta credential or provider invocation
        if: ${{ inputs.validate_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node research/mmp-078/validate-authorization.mjs
      - name: Publish admitted candidate capture receipt without credentials
        id: custody-capture
        if: ${{ !cancelled() && steps.generation.outcome == 'success' }}
        run: node packages/agent-real/src/custody-steps.mjs capture
      - name: Independent pre-Oracle owned-resource checkpoint
        id: custody-finalizer
        if: ${{ always() && !inputs.validate_only && steps.generation.outcome != 'skipped' }}
        run: node packages/agent-real/src/custody-steps.mjs finalize
      - name: Require early capture and independent pre-Oracle zero-resource proof
        id: custody-gate
        if: ${{ !cancelled() && steps.custody-capture.outcome == 'success' && steps.custody-finalizer.outcome == 'success' }}
        run: node packages/agent-real/src/custody-steps.mjs prepare-upload
      - name: Store only the unverified candidate ciphertext for seven days
        id: custody-upload
        if: ${{ !cancelled() && steps.custody-gate.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: mmp107-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mmp115-custody/candidate.age
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Retrieve the exact newly acknowledged artifact by ID
        id: custody-download
        if: ${{ !cancelled() && steps.custody-upload.outcome == 'success' && steps.custody-upload.outputs.artifact-id != '' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.custody-upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/mmp115-readback
          merge-multiple: true
      - name: Verify authenticated run metadata and retrieved ciphertext bytes
        id: custody-stored
        if: ${{ !cancelled() && steps.custody-download.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MMP115_ARTIFACT_ID: ${{ steps.custody-upload.outputs.artifact-id }}
          MMP115_ARCHIVE_SHA256: ${{ steps.custody-upload.outputs.artifact-digest }}
          MMP115_UPLOAD_OUTCOME: ${{ steps.custody-upload.outcome }}
          MMP115_DOWNLOAD_OUTCOME: ${{ steps.custody-download.outcome }}
        run: node packages/agent-real/src/custody-steps.mjs verify-download
      - name: Independent Docker Oracle after verified stored source checkpoint
        id: validation
        if: ${{ !cancelled() && steps.generation.outcome == 'success' && steps.custody-stored.outcome == 'success' }}
        run: node research/mmp-078/validate-candidate.mjs
      - name: Preserve one attributable candidate under approved encrypted export policy
        id: preservation
        if: ${{ !cancelled() && steps.generation.outcome == 'success' }}
        run: node research/mmp-089/preserve.mjs
      - name: Final owned-resource inventory without credential
        id: finalizer
        if: always()
        env:
          WORKSHOP_PUBLIC_OUTPUT: ${{ runner.temp }}/meta-paid-public
          PILOT_HEAD_SHA: ${{ github.sha }}
        run: node packages/differential/src/workshop-finalizer.mjs
      - name: Require encryption and both normal and independent cleanup proofs
        id: diagnostic-gate
        if: ${{ !cancelled() && steps.generation.outcome == 'success' && steps.preservation.outcome == 'success' && steps.finalizer.outcome == 'success' }}
        env:
          MMP089_PRESERVE_OUTCOME: ${{ steps.preservation.outcome }}
          MMP089_FINALIZER_OUTCOME: ${{ steps.finalizer.outcome }}
        run: node research/mmp-089/prepare-upload.mjs
      - name: Upload only approved authenticated ciphertext for seven days
        id: diagnostic-upload
        if: ${{ !cancelled() && steps.diagnostic-gate.outcome == 'success' && steps.diagnostic-gate.outputs.eligible == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: mmp089-private-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mmp089-private-diagnostics/candidate-diagnostics.age
          if-no-files-found: error
          retention-days: 7
      - name: Record preservation only after artifact upload completes
        if: ${{ !cancelled() && (steps.diagnostic-upload.outcome == 'success' || steps.diagnostic-upload.outcome == 'failure') }}
        env:
          MMP089_UPLOAD_OUTCOME: ${{ steps.diagnostic-upload.outcome }}
        run: node research/mmp-089/record-upload.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meta-paid-public-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/meta-paid-public/generation.json
            ${{ runner.temp }}/meta-paid-public/trial.json
            ${{ runner.temp }}/meta-paid-public/finalizer.json
            ${{ runner.temp }}/meta-paid-public/authorization.json
            ${{ runner.temp }}/meta-paid-public/preservation.json
            ${{ runner.temp }}/meta-paid-public/custody-capture.json
            ${{ runner.temp }}/meta-paid-public/custody-finalizer.json
            ${{ runner.temp }}/meta-paid-public/custody-checkpoint.json
            ${{ runner.temp }}/meta-paid-public/custody-stored.json
            ${{ runner.temp }}/meta-paid-public/custody-failure.json
            ${{ runner.temp }}/mmp078-${{ github.run_id }}-attempt.json
          if-no-files-found: error
          retention-days: 7
